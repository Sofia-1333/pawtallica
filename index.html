<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pawtallica – Tu mascota, tu rock, tu estilo</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== 1. VARIABLES (colores en un solo lugar) ===== */
:root{--bg:#1b1b1b;--panel:#111;--rojo:#c1121f;--rojo2:#ff2a3a;--texto:#f2f2f2;--gris:#9a9a9a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--texto);font-family:Inter,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none;cursor:pointer}

/* ===== 2. HEADER ===== */
header{background:#000;display:flex;align-items:center;justify-content:space-between;padding:10px 24px;position:sticky;top:0;z-index:20;gap:12px;flex-wrap:wrap}
.logo{font-family:Oswald,Impact,sans-serif;font-size:1.8rem;letter-spacing:2px;color:#ddd;text-shadow:0 0 8px var(--rojo)}
.logo small{display:block;font-size:.5rem;color:var(--rojo2);letter-spacing:1px}
nav{display:flex;gap:34px}
nav button{font-weight:600;padding:6px 2px;border-bottom:2px solid transparent}
nav button.activo{border-color:var(--rojo)}
nav button:hover{color:var(--rojo2)}
.iconos{display:flex;gap:16px;align-items:center}
.iconos button{font-size:1.4rem;position:relative}
#contador{position:absolute;top:-8px;right:-10px;background:var(--rojo);border-radius:50%;font-size:.7rem;min-width:18px;height:18px;display:grid;place-items:center}

/* ===== 3. BANNER ===== */
main{flex:1;padding:18px 24px;max-width:1100px;margin:0 auto;width:100%}
.vista{display:none}.vista.activa{display:block}
.banner{background:radial-gradient(circle at 75% 40%,#7a0d14,#2a0508 55%,#0c0c0c);border-radius:6px;padding:48px 36px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;min-height:250px}
.banner h1{font-family:Oswald,Impact,sans-serif;font-size:2.4rem;line-height:1.15}
.banner h1 span{color:var(--rojo2)}
.banner p{letter-spacing:3px;font-size:.75rem;color:#ccc;margin:14px 0}
.btn{background:var(--rojo);padding:10px 22px;border-radius:4px;font-weight:600;display:inline-block}
.btn:hover{background:var(--rojo2)}
.banner{
  width: 100%;
  height: 300px;
  padding: 0;
  overflow: hidden;
  position: relative;
}
.imagen-banner{
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
}
/* ===== 4. PRODUCTOS ===== */
h2{font-family:Oswald,Impact,sans-serif;font-style:italic;color:var(--rojo2);margin:30px 0 16px;font-size:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.card{background:var(--panel);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.foto{height:160px;display:grid;place-items:center;font-size:4rem;background:linear-gradient(135deg,#3a0a0f,#111)}
.info{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.info small{color:var(--gris)}
.precio{font-weight:700}
.precio s{color:var(--gris);font-weight:400;margin-left:6px}
.info .btn{margin-top:auto;text-align:center;padding:8px}
.etiqueta{color:var(--rojo2);font-size:.75rem;font-weight:600}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.filtros button{border:1px solid var(--rojo);padding:6px 14px;border-radius:20px}
.filtros button.activo,.filtros button:hover{background:var(--rojo)}
/* ===== 5. FOOTER ===== */
footer{background:#000;padding:18px 24px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:20px;margin-top:30px}
footer h4{color:var(--rojo2);font-family:Oswald,sans-serif;margin-bottom:6px}
footer a{display:block;font-size:.8rem;color:var(--rojo);margin:3px 0}
footer a:hover{color:var(--rojo2)}
.redes{display:flex;gap:10px;font-size:1.5rem}

/* ===== 6. PANELES (carrito, buscador, modal) ===== */
.fondo{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:30}
.fondo.abierto{display:block}
.carrito{position:fixed;top:0;right:-380px;width:min(360px,100%);height:100%;background:var(--panel);z-index:40;transition:right .25s;padding:20px;display:flex;flex-direction:column;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.carrito.abierto{right:0}
.carrito h3{margin-bottom:12px}
#items{flex:1;overflow-y:auto}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #333;font-size:.9rem}
.cant button{border:1px solid var(--rojo);width:24px;height:24px;border-radius:4px}
.total{font-weight:700;font-size:1.1rem;margin:14px 0}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--rojo);border-radius:8px;padding:24px;z-index:40;width:min(400px,92%);display:none}
.modal.abierto{display:block}
.modal h3{margin-bottom:12px;color:var(--rojo2)}
.modal p{font-size:.9rem;line-height:1.5;color:#ccc;margin-bottom:12px}
input{width:100%;padding:10px;margin-bottom:10px;background:#222;border:1px solid #444;color:#fff;border-radius:4px;font:inherit}
.cerrar{float:right;font-size:1.2rem}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--rojo);padding:10px 20px;border-radius:6px;z-index:50;transition:transform .3s}
#toast.ver{transform:translateX(-50%) translateY(0)}
@media(max-width:640px){nav{gap:16px;order:3;width:100%;justify-content:center}.banner h1{font-size:1.8rem}}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <div class="logo">
    <img src="imagenes/logo.png" height="80">
  </div>
  <nav>
    <button data-vista="inicio" class="activo" onclick="irA('inicio')">Inicio</button>
    <button data-vista="tienda" onclick="irA('tienda')">Tienda</button>
    <button data-vista="ofertas" onclick="irA('ofertas')">Ofertas</button>
    <button data-vista="categorias" onclick="irA('categorias')">Categorías</button>
  </nav>
  <div class="iconos">
    <button onclick="abrir('buscador')" aria-label="Buscar"><img src="imagenes/busqueda.png"height="18">
    </button>
    <button onclick="abrir('usuario')" aria-label="Usuario"><img src="imagenes/perfil.png"height="30">

    </button>
    <button onclick="abrir('carrito')" aria-label="Carrito"><img src="imagenes/carrito.png"height="40">
      <span id="contador">0</span></button>
  </div>
</header>

<main>
  <!-- ===== INICIO ===== -->
  <section id="v-inicio" class="vista activa">
    <div class="banner">
    <img
        src="imagenes/banner.jpg"
        alt="Pawtallica: tienda de ropa y accesorios rockeros para mascotas"
        class="imagen-banner">
    </div>
    <h2> <img src="imagenes/rayo.png"height="40">Productos destacados<img src="imagenes/rayo.png"height="40">
    </h2>
    <div class="grid" id="g-destacados"></div>
  </section>

  <!-- ===== TIENDA ===== -->
  <section id="v-tienda" class="vista">
    <h2><img src="imagenes/rayo.png"height="40">Tienda<img src="imagenes/rayo.png"height="40">
    </h2>
    <div class="filtros" id="filtros"></div>
    <div class="grid" id="g-tienda"></div>
  </section>

  <!-- ===== OFERTAS ===== -->
  <section id="v-ofertas" class="vista">
    <h2><img src="imagenes/rayo.png"height="40">Ofertas<img src="imagenes/rayo.png"height="40">
    </h2>
    <div class="grid" id="g-ofertas"></div>
  </section>

  <!-- ===== CATEGORÍAS ===== -->
  <section id="v-categorias" class="vista">
    <h2><img src="imagenes/rayo.png"height="40">Categorías<img src="imagenes/rayo.png"height="40"></h2>
    <div class="grid" id="g-categorias"></div>
  </section>

  <!-- ===== RESULTADOS DE BÚSQUEDA ===== -->
  <section id="v-busqueda" class="vista">
    <h2 id="t-busqueda">Resultados</h2>
    <div class="grid" id="g-busqueda"></div>
  </section>
</main>

<!-- ===== FOOTER ===== -->
<footer>
  <div><h4>Información</h4>
    <a onclick="info('Sobre nosotros')">Sobre nosotros</a>
    <a onclick="info('Términos y condiciones')">Términos y condiciones</a>
    <a onclick="info('Política de privacidad')">Política de privacidad</a></div>
  <div><h4>Ayuda</h4>
    <a onclick="info('Preguntas frecuentes')">Preguntas frecuentes</a>
    <a onclick="info('Métodos de pago')">Métodos de pago</a>
    <a onclick="info('Envíos y devoluciones')">Envíos y devoluciones</a></div>
  <div><h4>Síguenos</h4>
    <div class="redes">
      <a onclick="toast('Abriendo Instagram…')">
        <img src="imagenes/icono_instagram.png" height="20" alt="Instagram">
      </a>
      <a onclick="toast('Abriendo Facebook…')"><img src="imagenes/facebook.png"height="20" alt="Facebook">
      </a>
      <a onclick="toast('Abriendo TikTok…')"><img src="imagenes/tiktok.png"height="23" alt="Tiktok">

      </a>
    </div></div>
</footer>

<!-- ===== PANELES ===== -->
<div class="fondo" id="fondo" onclick="cerrarTodo()"></div>

<aside class="carrito" id="carrito">
  <button class="cerrar" onclick="cerrarTodo()">✕</button>
  <h3><img src="imagenes/carrito.png"height="40"> Tu carrito</h3>
  <div id="items"></div>
  <div class="total">Total: <span id="total">$0</span></div>
  <button class="btn" onclick="pagar()">Finalizar compra</button>
  <button style="margin-top:8px;color:var(--gris)" onclick="vaciar()">Vaciar carrito</button>
</aside>

<div class="modal" id="buscador">
  <button class="cerrar" onclick="cerrarTodo()">✕</button>
  <h3>Buscar productos</h3>
  <input id="q" placeholder="Ej: Metallica, bandana…" onkeydown="if(event.key==='Enter')buscar()">
  <button class="btn" onclick="buscar()">Buscar</button>
</div>

<div class="modal" id="usuario">
  <button class="cerrar" onclick="cerrarTodo()">✕</button>
  <h3 id="u-titulo">Iniciar sesión</h3>
  <div id="u-form">
    <input id="u-nombre" placeholder="Tu nombre">
    <input id="u-correo" type="email" placeholder="Correo electrónico">
    <button class="btn" onclick="entrar()">Entrar</button>
  </div>
  <div id="u-ok" style="display:none">
    <p id="u-saludo"></p>
    <button class="btn" onclick="salir()">Cerrar sesión</button>
  </div>
</div>

<div class="modal" id="infoModal">
  <button class="cerrar" onclick="cerrarTodo()">✕</button>
  <h3 id="i-titulo"></h3>
  <p id="i-texto"></p>
</div>

<div id="toast"></div>

</div>
<script>
/* ===== lista de productos ===== */
const productos = [
  {id:1,nombre:"Camiseta Metallica",cat:"Camisetas",precio:45000,viejo:60000}, 
  {id:2,nombre:"Camiseta Led Zeppelin",cat:"Camisetas",precio:28000},
  {id:3,nombre:"Collar Guns N’ Roses",cat:"Collares",precio:35000,viejo:42000},
  {id:4,nombre:"Pañoleta Slipknot",cat:"Pañoletas",precio:28000},
  {id:5,nombre:"Camiseta AC/DC",cat:"Camisetas",precio:45000},
  {id:6,nombre:"Collar con púas",cat:"Collares",precio:32000,viejo:40000},
  {id:7,nombre:"Gafas rockeras",cat:"Accesorios",precio:22000},
  {id:8,nombre:"Chaqueta de cuero",cat:"Chaquetas",precio:89000,viejo:110000}
];
const categorias = [...new Set(productos.map(p=>p.cat))];
const $ = id => document.getElementById(id);
const fmt = n => "$" + n.toLocaleString("es-CO");
let carrito = [];
try { carrito = JSON.parse(localStorage.getItem("pawCarrito")) || []; } catch(e){}

/* ===== 2. DIBUJAR PRODUCTOS ===== */
function tarjeta(p){
  return `<div class="card"><div class="foto">${p.emoji}</div><div class="info">
    <small>${p.cat}</small><strong>${p.nombre}</strong>
    ${p.viejo?'<span class="etiqueta">¡OFERTA!</span>':''}
    <div class="precio">${fmt(p.precio)}${p.viejo?`<s>${fmt(p.viejo)}</s>`:''}</div>
    <button class="btn" onclick="agregar(${p.id})">Agregar al carrito</button></div></div>`;
}
function pintar(id,lista){ $(id).innerHTML = lista.length ? lista.map(tarjeta).join("") : "<p>No se encontraron productos.</p>"; }

function filtrarTienda(cat,btn){
  document.querySelectorAll("#filtros button").forEach(b=>b.classList.remove("activo"));
  btn.classList.add("activo");
  pintar("g-tienda", cat==="Todos" ? productos : productos.filter(p=>p.cat===cat));
}
function iniciar(){
  pintar("g-destacados", productos.slice(0,4));
  pintar("g-tienda", productos);
  pintar("g-ofertas", productos.filter(p=>p.viejo));
  $("filtros").innerHTML = ["Todos",...categorias].map((c,i)=>
    `<button class="${i?'':'activo'}" onclick="filtrarTienda('${c}',this)">${c}</button>`).join("");
  $("g-categorias").innerHTML = categorias.map(c=>{
    const n = productos.filter(p=>p.cat===c).length;
    return `<div class="card" style="cursor:pointer" onclick="irACategoria('${c}')"><div class="foto">🎸</div>
      <div class="info"><strong>${c}</strong><small>${n} producto${n>1?'s':''}</small></div></div>`;
  }).join("");
  dibujarCarrito();
}
function irACategoria(c){
  irA("tienda");
  const b=[...document.querySelectorAll("#filtros button")].find(x=>x.textContent===c);
  if(b) filtrarTienda(c,b);
}

/* ===== 3. NAVEGACIÓN (mostrar/ocultar secciones) ===== */
function irA(v){
  document.querySelectorAll(".vista").forEach(s=>s.classList.remove("activa"));
  $("v-"+v).classList.add("activa");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("activo",b.dataset.vista===v));
  cerrarTodo(); window.scrollTo({top:0,behavior:"smooth"});
}

/* ===== 4. CARRITO ===== */
function guardar(){ try{ localStorage.setItem("pawCarrito",JSON.stringify(carrito)); }catch(e){} }
function agregar(id){
  const it = carrito.find(c=>c.id===id);
  it ? it.cant++ : carrito.push({id,cant:1});
  guardar(); dibujarCarrito(); toast("Agregado al carrito 🤘");
}
function cambiar(id,d){
  const it = carrito.find(c=>c.id===id); it.cant += d;
  if(it.cant<=0) carrito = carrito.filter(c=>c.id!==id);
  guardar(); dibujarCarrito();
}
function vaciar(){ carrito=[]; guardar(); dibujarCarrito(); }
function dibujarCarrito(){
  let total=0, n=0;
  $("items").innerHTML = carrito.length ? carrito.map(c=>{
    const p = productos.find(x=>x.id===c.id); total += p.precio*c.cant; n += c.cant;
    return `<div class="item"><span>${p.emoji} ${p.nombre}<br><small>${fmt(p.precio)}</small></span>
      <span class="cant"><button onclick="cambiar(${p.id},-1)">−</button> ${c.cant} <button onclick="cambiar(${p.id},1)">+</button></span></div>`;
  }).join("") : "<p style='color:var(--gris)'>Tu carrito está vacío.</p>";
  $("total").textContent = fmt(total); $("contador").textContent = n;
}
function pagar(){
  if(!carrito.length) return toast("Agrega algo primero");
  vaciar(); cerrarTodo(); toast("¡Compra simulada con éxito! 🎉");
}

/* ===== 5. BUSCADOR ===== */
function buscar(){
  const t = $("q").value.trim().toLowerCase();
  if(!t) return toast("Escribe algo para buscar");
  const r = productos.filter(p=>(p.nombre+" "+p.cat).toLowerCase().includes(t));
  pintar("g-busqueda", r); $("t-busqueda").textContent = `Resultados para «${t}»`;
  irA("busqueda");
}

/* ===== 6. USUARIO ===== */
function entrar(){
  const n=$("u-nombre").value.trim(), c=$("u-correo").value.trim();
  if(!n || !c.includes("@")) return toast("Escribe tu nombre y un correo válido");
  try{ localStorage.setItem("pawUser",n); }catch(e){}
  estadoUsuario(n); toast("Bienvenido, "+n+" 🤘");
}
function salir(){ try{ localStorage.removeItem("pawUser"); }catch(e){} estadoUsuario(null); }
function estadoUsuario(n){
  $("u-form").style.display = n?"none":"block"; $("u-ok").style.display = n?"block":"none";
  $("u-titulo").textContent = n?"Mi cuenta":"Iniciar sesión";
  if(n) $("u-saludo").textContent = "Hola, "+n+". ¡Tu mascota ya es una estrella de rock!";
}

/* ===== 7. PANELES, INFO Y AVISOS ===== */
const textos = {
 "Sobre nosotros":"Pawtallica nació del amor por el rock y por las mascotas. Vestimos a tu mejor amigo con estilo.",
 "Términos y condiciones":"Al comprar aceptas nuestras condiciones de venta, precios en pesos colombianos y disponibilidad sujeta a inventario.",
 "Política de privacidad":"Solo usamos tus datos para procesar tus pedidos. Nunca los vendemos a terceros.",
 "Preguntas frecuentes":"¿Hay tallas? Sí, de XS a XL. ¿Cuánto tarda el envío? Entre 2 y 5 días hábiles.",
 "Métodos de pago":"Tarjeta de crédito o débito, PSE y pago contra entrega.",
 "Envíos y devoluciones":"Envíos a todo el país. Tienes 15 días para cambios o devoluciones."
};
function abrir(id){ cerrarTodo(); $("fondo").classList.add("abierto"); $(id).classList.add("abierto"); }
function cerrarTodo(){ $("fondo").classList.remove("abierto"); ["carrito","buscador","usuario","infoModal"].forEach(i=>$(i).classList.remove("abierto")); }
function info(t){ $("i-titulo").textContent=t; $("i-texto").textContent=textos[t]; abrir("infoModal"); }
let tt; function toast(m){ $("toast").textContent=m; $("toast").classList.add("ver"); clearTimeout(tt); tt=setTimeout(()=>$("toast").classList.remove("ver"),2200); }

iniciar();
let guardado=null; try{ guardado=localStorage.getItem("pawUser"); }catch(e){}
estadoUsuario(guardado);
</script>
</body>
</html>
